<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 & 단어 멀티플레이 빙고</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .size-selector {
      display: flex;
      gap: 8px;
    }

    .size-btn {
      flex: 1;
      padding: 10px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: #475569;
    }

    .size-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    /* 접을 수 있는 아코디언 스타일 */
    details.custom-accordion {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    details.custom-accordion summary {
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    details.custom-accordion summary:hover {
      color: #2563eb;
    }

    .accordion-content {
      margin-top: 10px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
      font-family: monospace;
      background: #ffffff;
    }
    textarea:focus {
      border-color: #2563eb;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      margin-top: 8px;
    }
    .search-input:focus {
      border-color: #2563eb;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 8px;
    }

    .pool-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 4px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .pool-chip img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .pool-chip.checked {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 700;
    }

    .badge {
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #64748b;
    }

    .badge.ready {
      background: #dcfce7;
      color: #15803d;
      font-weight: 700;
    }

    /* 빙고판 레이아웃 */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .bingo-score {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2563eb;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      align-items: center;
      justify-content: space-between;
    }

    .mode-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #f59e0b;
      border-color: #d97706;
      color: #ffffff;
    }

    .grid {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }

    .cell {
      position: relative;
      aspect-ratio: 1;
      background-color: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .cell:hover {
      border-color: #94a3b8;
    }

    .cell.edit-source {
      border-color: #f59e0b !important;
      transform: scale(0.95);
      background-color: #fef3c7;
    }

    .cell.drag-over {
      border: 2px dashed #f59e0b !important;
    }

    .cell img {
      width: 100%;
      height: 62%;
      object-fit: cover;
      border-radius: 4px;
      pointer-events: none;
    }

    .cell .word-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      margin-top: 2px;
    }

    .cell.selected {
      border-color: #2563eb;
      transform: scale(0.96);
    }

    .cell.selected::after {
      content: "✓";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(37, 99, 235, 0.75);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button.action-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .btn-share { background-color: #059669; color: white; }
    .btn-share:hover { background-color: #047857; }

    .btn-image { background-color: #4f46e5; color: white; }
    .btn-image:hover { background-color: #4338ca; }

    .btn-secondary { background-color: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background-color: #cbd5e1; }

    .link-btn {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🖼️ 커스텀 이미지 빙고판</h1>

    <!-- 1. 판 크기 선택 -->
    <div class="section">
      <div class="section-title">1. 빙고판 크기 선택</div>
      <div class="size-selector">
        <button class="size-btn" onclick="changeSize(4)">4 x 4 (16칸)</button>
        <button class="size-btn active" onclick="changeSize(5)">5 x 5 (25칸)</button>
        <button class="size-btn" onclick="changeSize(6)">6 x 6 (36칸)</button>
      </div>
    </div>

    <!-- 2. 단어 풀 선택 및 관리 -->
    <div class="section">
      <!-- 기본 접힘 처리된 데이터 수동 관리 영역 -->
      <details class="custom-accordion">
        <summary>⚙️ 단어 & 이미지 데이터 직접 관리 (클릭하여 열기)</summary>
        <div class="accordion-content">
          <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
            <button class="link-btn" onclick="reloadDefaultJson()">기본 items.json으로 새로고침</button>
          </div>
          <textarea id="customInput" placeholder="단어 | 이미지URL 형식으로 한 줄씩 입력하세요."></textarea>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="action-btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="saveCustomItems()">목록 적용 & 저장</button>
          </div>
        </div>
      </details>

      <div class="section-title" style="margin-top: 10px;">
        <span>2. 빙고판에 넣을 아이템 선택</span>
        <span class="badge" id="selectionCount">선택: 0 / 25</span>
      </div>

      <input type="text" id="searchInput" class="search-input" placeholder="🔍 단어 검색..." oninput="handleSearch()">
      <div class="word-pool" id="itemPool"></div>
      
      <div style="margin-top: 8px; display: flex; justify-content: flex-end; gap: 12px;">
        <button class="link-btn" onclick="selectAllItems()">전체 선택</button>
        <button class="link-btn" onclick="clearSelectedItems()">선택 해제</button>
        <button class="link-btn" onclick="autoSelectItems()">필요한 만큼 자동 선택</button>
      </div>
    </div>

    <!-- 3. 생성 및 공유 -->
    <div class="section" style="border-bottom: none; margin-bottom: 0;">
      <div class="btn-group">
        <button class="action-btn btn-primary" id="btnGenerate" onclick="generateNewGame()" disabled>새 빙고판 생성하기</button>
        <button class="action-btn btn-share" id="btnShare" onclick="copyShareUrl()" style="display: none;">🔗 현재 빙고판 공유 링크 복사</button>
      </div>
    </div>

    <!-- 4. 게임 영역 -->
    <div id="gameArea" style="display: none; margin-top: 20px;">
      <div class="game-header">
        <div class="bingo-score" id="bingoScore">완성된 빙고: 0줄</div>
        <button class="action-btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="resetCheck()">체크 초기화</button>
      </div>

      <!-- 배치 편집 도구 바 -->
      <div class="mode-bar">
        <button class="mode-btn" id="btnEditMode" onclick="toggleEditMode()">✏️ 배치 직접 바꾸기</button>
        <button class="action-btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="shuffleCurrentBoard()">🔀 무작위 다시 섞기</button>
      </div>
      
      <div class="grid" id="board"></div>

      <div class="btn-group">
        <button class="action-btn btn-image" onclick="exportAsImage()">📸 빙고 결과 이미지로 저장 (PNG)</button>
      </div>
    </div>
  </div>

  <script>
    let currentSize = 5;
    let itemList = [];
    let selectedIndices = new Set();
    let currentBoard = [];
    let currentFilter = "";
    
    let isEditMode = false;
    let selectedSwapIndex = null;
    let draggedIndex = null;

    async function fetchDefaultItems() {
      try {
        const response = await fetch("./items.json");
        if (!response.ok) throw new Error("JSON 응답 실패");
        return await response.json();
      } catch (err) {
        console.warn("items.json 로드 실패:", err);
        return [];
      }
    }

    async function initApp() {
      const saved = localStorage.getItem("custom_image_bingo_items");
      if (saved) {
        try {
          itemList = JSON.parse(saved);
        } catch (e) {
          itemList = await fetchDefaultItems();
        }
      } else {
        itemList = await fetchDefaultItems();
      }
      
      updateTextarea();
      renderItemPool();
      autoSelectItems();
      checkSharedUrl();
    }

    async function reloadDefaultJson() {
      if (confirm("items.json 파일의 원본 데이터로 초기화하시겠습니까? (로컬 수정 내역 삭제)")) {
        localStorage.removeItem("custom_image_bingo_items");
        itemList = await fetchDefaultItems();
        updateTextarea();
        selectedIndices.clear();
        document.getElementById("searchInput").value = "";
        currentFilter = "";
        renderItemPool();
        autoSelectItems();
      }
    }

    function updateTextarea() {
      document.getElementById("customInput").value = itemList.map(i => `${i.word} | ${i.img}`).join("\n");
    }

    function saveCustomItems() {
      const text = document.getElementById("customInput").value;
      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      const parsed = [];

      lines.forEach(line => {
        const parts = line.split("|").map(p => p.trim());
        if (parts.length >= 2) {
          parsed.push({ word: parts[0], img: parts[1] });
        } else if (parts.length === 1) {
          parsed.push({ word: parts[0], img: "" });
        }
      });

      if (parsed.length < 16) {
        alert("최소 16개 이상의 아이템이 필요합니다.");
        return;
      }

      itemList = parsed;
      localStorage.setItem("custom_image_bingo_items", JSON.stringify(itemList));
      selectedIndices.clear();
      document.getElementById("searchInput").value = "";
      currentFilter = "";
      renderItemPool();
      autoSelectItems();
      alert(`${itemList.length}개의 아이템이 적용 및 저장되었습니다.`);
    }

    function handleSearch() {
      currentFilter = document.getElementById("searchInput").value.trim().toLowerCase();
      renderItemPool();
    }

    function renderItemPool() {
      const container = document.getElementById("itemPool");
      container.innerHTML = "";
      
      itemList.forEach((item, idx) => {
        if (currentFilter && !item.word.toLowerCase().includes(currentFilter)) {
          return;
        }

        const chip = document.createElement("div");
        chip.className = `pool-chip ${selectedIndices.has(idx) ? "checked" : ""}`;
        
        const imgTag = item.img ? `<img src="${item.img}" alt="${item.word}" loading="lazy" onerror="this.style.display='none'">` : "";
        chip.innerHTML = `${imgTag}<span>${item.word}</span>`;
        chip.onclick = () => toggleItemSelection(idx, chip);
        container.appendChild(chip);
      });
      updateSelectionUI();
    }

    function toggleItemSelection(idx, chipElement) {
      if (selectedIndices.has(idx)) {
        selectedIndices.delete(idx);
        chipElement.classList.remove("checked");
      } else {
        if (selectedIndices.size >= currentSize * currentSize) {
          alert(`현재 크기(${currentSize}x${currentSize})에서는 최대 ${currentSize * currentSize}개만 선택할 수 있습니다.`);
          return;
        }
        selectedIndices.add(idx);
        chipElement.classList.add("checked");
      }
      updateSelectionUI();
    }

    function autoSelectItems() {
      const target = currentSize * currentSize;
      selectedIndices.clear();
      const indices = Array.from({ length: itemList.length }, (_, i) => i);
      indices.sort(() => 0.5 - Math.random());
      indices.slice(0, target).forEach(i => selectedIndices.add(i));
      renderItemPool();
    }

    function selectAllItems() {
      const target = currentSize * currentSize;
      selectedIndices.clear();
      for (let i = 0; i < Math.min(target, itemList.length); i++) {
        selectedIndices.add(i);
      }
      renderItemPool();
    }

    function clearSelectedItems() {
      selectedIndices.clear();
      renderItemPool();
    }

    function changeSize(size) {
      currentSize = size;
      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.includes(`${size} x ${size}`));
      });

      const maxCount = currentSize * currentSize;
      if (selectedIndices.size > maxCount) {
        selectedIndices = new Set(Array.from(selectedIndices).slice(0, maxCount));
        renderItemPool();
      }
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const target = currentSize * currentSize;
      const countLabel = document.getElementById("selectionCount");
      const generateBtn = document.getElementById("btnGenerate");

      countLabel.innerText = `선택: ${selectedIndices.size} / ${target}`;
      if (selectedIndices.size === target) {
        countLabel.classList.add("ready");
        generateBtn.disabled = false;
      } else {
        countLabel.classList.remove("ready");
        generateBtn.disabled = true;
      }
    }

    function generateNewGame() {
      const chosenItems = Array.from(selectedIndices).map(idx => itemList[idx]);
      chosenItems.sort(() => 0.5 - Math.random());
      currentBoard = chosenItems.map(item => ({ ...item, selected: false }));
      
      renderGameBoard();
      document.getElementById("gameArea").style.display = "block";
      document.getElementById("btnShare").style.display = "block";
      updateScore();
    }

    function shuffleCurrentBoard() {
      currentBoard.sort(() => 0.5 - Math.random());
      renderGameBoard();
      updateScore();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      selectedSwapIndex = null;
      const btn = document.getElementById("btnEditMode");
      btn.classList.toggle("active", isEditMode);
      btn.innerText = isEditMode ? "완료 (플레이 모드)" : "✏️ 배치 직접 바꾸기";
      renderGameBoard();
    }

    function swapCells(idx1, idx2) {
      const temp = currentBoard[idx1];
      currentBoard[idx1] = currentBoard[idx2];
      currentBoard[idx2] = temp;
      selectedSwapIndex = null;
      renderGameBoard();
      updateScore();
    }

    function renderGameBoard() {
      const boardElement = document.getElementById("board");
      boardElement.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
      boardElement.innerHTML = "";

      currentBoard.forEach((item, index) => {
        const cell = document.createElement("div");
        cell.className = `cell ${!isEditMode && item.selected ? "selected" : ""} ${selectedSwapIndex === index ? "edit-source" : ""}`;
        
        if (isEditMode) {
          cell.draggable = true;
          cell.title = "드래그하거나 클릭하여 자리를 바꿀 수 있습니다.";

          cell.ondragstart = (e) => {
            draggedIndex = index;
            e.dataTransfer.effectAllowed = "move";
          };
          cell.ondragover = (e) => {
            e.preventDefault();
            cell.classList.add("drag-over");
          };
          cell.ondragleave = () => {
            cell.classList.remove("drag-over");
          };
          cell.ondrop = (e) => {
            e.preventDefault();
            cell.classList.remove("drag-over");
            if (draggedIndex !== null && draggedIndex !== index) {
              swapCells(draggedIndex, index);
            }
          };
        }

        const imgTag = item.img ? `<img src="${item.img}" alt="${item.word}" loading="lazy" crossorigin="anonymous">` : `<div style="height:62%;"></div>`;
        cell.innerHTML = `
          ${imgTag}
          <div class="word-label">${item.word}</div>
        `;

        cell.onclick = () => {
          if (isEditMode) {
            if (selectedSwapIndex === null) {
              selectedSwapIndex = index;
              renderGameBoard();
            } else if (selectedSwapIndex === index) {
              selectedSwapIndex = null;
              renderGameBoard();
            } else {
              swapCells(selectedSwapIndex, index);
            }
          } else {
            currentBoard[index].selected = !currentBoard[index].selected;
            renderGameBoard();
            updateScore();
          }
        };

        boardElement.appendChild(cell);
      });
    }

    function resetCheck() {
      currentBoard.forEach(c => c.selected = false);
      renderGameBoard();
      updateScore();
    }

    function updateScore() {
      const lines = calculateBingoLines();
      document.getElementById("bingoScore").innerText = `완성된 빙고: ${lines}줄`;
    }

    function calculateBingoLines() {
      let lines = 0;
      const n = currentSize;

      for (let r = 0; r < n; r++) {
        if (currentBoard.slice(r * n, (r + 1) * n).every(c => c.selected)) lines++;
      }
      for (let c = 0; c < n; c++) {
        let full = true;
        for (let r = 0; r < n; r++) {
          if (!currentBoard[r * n + c].selected) { full = false; break; }
        }
        if (full) lines++;
      }
      let d1 = true;
      for (let i = 0; i < n; i++) {
        if (!currentBoard[i * n + i].selected) { d1 = false; break; }
      }
      if (d1) lines++;

      let d2 = true;
      for (let i = 0; i < n; i++) {
        if (!currentBoard[i * n + (n - 1 - i)].selected) { d2 = false; break; }
      }
      if (d2) lines++;

      return lines;
    }

    function copyShareUrl() {
      const chosenItems = currentBoard.map(b => ({ word: b.word, img: b.img }));
      const payload = {
        s: currentSize,
        items: chosenItems
      };
      
      const hashData = btoa(encodeURIComponent(JSON.stringify(payload)));
      const shareUrl = `${window.location.origin}${window.location.pathname}#${hashData}`;

      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("현재 배치된 빙고판 링크가 복사되었습니다!");
      }).catch(() => {
        prompt("아래 링크를 복사하세요:", shareUrl);
      });
    }

    function checkSharedUrl() {
      if (window.location.hash) {
        try {
          const hashData = window.location.hash.substring(1);
          const payload = JSON.parse(decodeURIComponent(atob(hashData)));

          currentSize = payload.s;
          changeSize(currentSize);
          currentBoard = payload.items.map(item => ({ ...item, selected: false }));
          renderGameBoard();
          document.getElementById("gameArea").style.display = "block";
          document.getElementById("btnShare").style.display = "block";
          updateScore();
        } catch (e) {
          console.error("공유 데이터 로드 실패", e);
        }
      }
    }

    async function exportAsImage() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const dpr = 2;

      const width = 640;
      const padding = 24;
      const headerHeight = 90;
      const boardWidth = width - padding * 2;
      const gap = 8;
      const cellSize = (boardWidth - (currentSize - 1) * gap) / currentSize;
      const boardHeight = cellSize * currentSize + (currentSize - 1) * gap;
      const totalHeight = headerHeight + boardHeight + padding + 20;

      canvas.width = width * dpr;
      canvas.height = totalHeight * dpr;
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, width, totalHeight);

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 22px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${currentSize} x ${currentSize} 이미지 BINGO`, width / 2, 40);

      ctx.fillStyle = "#2563eb";
      ctx.font = "bold 16px -apple-system, sans-serif";
      ctx.fillText(`완성된 빙고: ${calculateBingoLines()}줄`, width / 2, 68);

      const imagePromises = currentBoard.map(item => {
        return new Promise((resolve) => {
          if (!item.img) return resolve(null);
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = item.img;
        });
      });

      const loadedImages = await Promise.all(imagePromises);

      currentBoard.forEach((item, index) => {
        const row = Math.floor(index / currentSize);
        const col = index % currentSize;
        const x = padding + col * (cellSize + gap);
        const y = headerHeight + row * (cellSize + gap);

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = item.selected ? "#2563eb" : "#cbd5e1";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x, y, cellSize, cellSize, 8);
        ctx.fill();
        ctx.stroke();
        ctx.clip();

        const loadedImg = loadedImages[index];
        const imgH = cellSize * 0.62;
        if (loadedImg) {
          ctx.drawImage(loadedImg, x + 4, y + 4, cellSize - 8, imgH);
        }

        ctx.fillStyle = "#1e293b";
        ctx.font = `bold ${cellSize < 70 ? "11px" : "13px"} -apple-system, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.word, x + cellSize / 2, y + imgH + (cellSize - imgH) / 2 + 2);

        if (item.selected) {
          ctx.fillStyle = "rgba(37, 99, 235, 0.75)";
          ctx.fillRect(x, y, cellSize, cellSize);
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${cellSize * 0.4}px -apple-system, sans-serif`;
          ctx.fillText("✓", x + cellSize / 2, y + cellSize / 2);
        }
        ctx.restore();
      });

      const link = document.createElement("a");
      link.download = `image_bingo_${Date.now()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    initApp();
  </script>
</body>
</html>
