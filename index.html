<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블루아카이브 인권/전무 빙고</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .title-input-wrap {
      margin-bottom: 20px;
    }

    .title-input-wrap label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .title-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      outline: none;
      color: #0f172a;
    }
    .title-input:focus {
      border-color: #2563eb;
    }

    .section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .size-selector {
      display: flex;
      gap: 8px;
    }

    .size-btn {
      flex: 1;
      padding: 10px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: #475569;
    }

    .size-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    details.custom-accordion {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    details.custom-accordion summary {
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    .accordion-content {
      margin-top: 10px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
      font-family: monospace;
      background: #ffffff;
    }
    textarea:focus {
      border-color: #2563eb;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      margin-top: 8px;
    }
    .search-input:focus {
      border-color: #2563eb;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 8px;
    }

    .pool-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 4px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .pool-chip img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .pool-chip.checked {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      font-weight: 700;
    }

    .badge {
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #64748b;
    }

    .badge.ready {
      background: #dcfce7;
      color: #15803d;
      font-weight: 700;
    }

    .criteria-box {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .criteria-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
    }

    .radio-group {
      display: flex;
      gap: 12px;
    }

    .radio-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .radio-btn input {
      display: none;
    }

    .radio-btn.active {
      background: #eff6ff;
      border-color: #2563eb;
      color: #1d4ed8;
      font-weight: 700;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .bingo-score {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2563eb;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      align-items: center;
      justify-content: space-between;
    }

    .mode-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #f59e0b;
      border-color: #d97706;
      color: #ffffff;
    }

    .grid {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }

    .cell {
      position: relative;
      aspect-ratio: 1;
      background-color: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
      transition: all 0.15s ease;
    }

    .cell:hover {
      border-color: #94a3b8;
    }

    .cell.edit-source {
      border-color: #f59e0b !important;
      transform: scale(0.95);
      background-color: #fef3c7;
    }

    .cell.drag-over {
      border: 2px dashed #f59e0b !important;
    }

    .cell img {
      width: 100%;
      height: 60%;
      object-fit: cover;
      border-radius: 4px;
      pointer-events: none;
      transition: filter 0.15s ease;
    }

    /* 우측 상단 조건 캡션 (전3 등) */
    .caption-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      z-index: 2;
      pointer-events: none;
      line-height: 1.2;
    }

    /* 좌측 상단 체크 상태 뱃지 (보유 / 전무★) */
    .state-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      z-index: 2;
      pointer-events: none;
      line-height: 1.2;
      color: #ffffff;
    }
    .state-badge.status-1 {
      background: #eab308;
      box-shadow: 0 1px 3px rgba(234, 179, 8, 0.4);
    }
    .state-badge.status-2 {
      background: #0891b2;
      box-shadow: 0 1px 3px rgba(8, 145, 178, 0.4);
    }

    .cell-caption-input {
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      z-index: 4;
      font-size: 0.7rem;
      padding: 2px 4px;
      border: 1px solid #f59e0b;
      border-radius: 4px;
      background: #ffffff;
      text-align: center;
      font-weight: 700;
      outline: none;
    }

    .cell .word-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      margin-top: 2px;
    }

    /* 🟡 상태 1: 명함 보유 (테두리 3px + 소프트 틴트) */
    .cell.status-1 {
      border: 3px solid #eab308 !important;
      background-color: #fefce8;
      box-shadow: inset 0 0 8px rgba(234, 179, 8, 0.15);
    }

    /* 🔵 상태 2: 전용무기 장착 (테두리 3px + 소프트 틴트) */
    .cell.status-2 {
      border: 3px solid #06b6d4 !important;
      background-color: #ecfeff;
      box-shadow: inset 0 0 8px rgba(6, 182, 212, 0.2);
    }

    .help-hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 8px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button.action-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .btn-share { background-color: #059669; color: white; }
    .btn-share:hover { background-color: #047857; }

    .btn-image { background-color: #4f46e5; color: white; }
    .btn-image:hover { background-color: #4338ca; }

    .btn-secondary { background-color: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background-color: #cbd5e1; }

    .link-btn {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-input-wrap">
      <label for="boardTitle">📌 빙고 제목</label>
      <input type="text" id="boardTitle" class="title-input" value="블루아카이브 인권 캐릭터 빙고" placeholder="빙고판 제목을 입력하세요">
    </div>

    <!-- 1. 판 크기 선택 -->
    <div class="section">
      <div class="section-title">1. 빙고판 크기 선택</div>
      <div class="size-selector">
        <button class="size-btn" onclick="changeSize(4)">4 x 4 (16칸)</button>
        <button class="size-btn active" onclick="changeSize(5)">5 x 5 (25칸)</button>
        <button class="size-btn" onclick="changeSize(6)">6 x 6 (36칸)</button>
      </div>
    </div>

    <!-- 2. 단어 풀 관리 및 선택 -->
    <div class="section">
      <details class="custom-accordion">
        <summary>⚙️ 단어 & 이미지 데이터 직접 관리 (클릭하여 열기)</summary>
        <div class="accordion-content">
          <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
            <button class="link-btn" onclick="reloadDefaultJson()">기본 items.json으로 새로고침</button>
          </div>
          <textarea id="customInput" placeholder="단어 | 이미지URL 형식으로 한 줄씩 입력하세요."></textarea>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="action-btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="saveCustomItems()">목록 적용 & 저장</button>
          </div>
        </div>
      </details>

      <div class="section-title" style="margin-top: 10px;">
        <span>2. 빙고판에 넣을 캐릭터 선택</span>
        <span class="badge" id="selectionCount">선택: 0 / 25</span>
      </div>

      <input type="text" id="searchInput" class="search-input" placeholder="🔍 캐릭터 이름 검색..." oninput="handleSearch()">
      <div class="word-pool" id="itemPool"></div>
      
      <div style="margin-top: 8px; display: flex; justify-content: flex-end; gap: 12px;">
        <button class="link-btn" onclick="selectAllItems()">전체 선택</button>
        <button class="link-btn" onclick="clearSelectedItems()">선택 해제</button>
        <button class="link-btn" onclick="autoSelectItems()">필요한 만큼 자동 선택</button>
      </div>
    </div>

    <!-- 3. 생성 및 공유 -->
    <div class="section" style="border-bottom: none; margin-bottom: 0;">
      <div class="btn-group">
        <button class="action-btn btn-primary" id="btnGenerate" onclick="generateNewGame()" disabled>새 빙고판 생성하기</button>
        <button class="action-btn btn-share" id="btnShare" onclick="copyShareUrl()" style="display: none;">🔗 현재 빙고판 공유 링크 복사</button>
      </div>
    </div>

    <!-- 4. 게임 영역 -->
    <div id="gameArea" style="display: none; margin-top: 20px;">
      
      <div class="criteria-box">
        <div class="criteria-label">🎯 빙고 판정 기준 선택</div>
        <div class="radio-group">
          <label class="radio-btn active" id="labelOwnership" onclick="setCriteria('ownership')">
            <input type="radio" name="bingoCriteria" value="ownership" checked>
            <span>🟡 단순 보유 기준 (명함 이상)</span>
          </label>
          <label class="radio-btn" id="labelWeapon" onclick="setCriteria('weapon')">
            <input type="radio" name="bingoCriteria" value="weapon">
            <span>🔵 전용무기 기준 (전무 장착만)</span>
          </label>
        </div>
      </div>

      <div class="game-header">
        <div class="bingo-score" id="bingoScore">완성된 빙고: 0줄</div>
        <button class="action-btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="resetCheck()">체크 초기화</button>
      </div>

      <div class="help-hint">💡 칸을 누를 때마다 [미보유] ➔ [🟡 보유] ➔ [🔵 전무★] 순으로 순환합니다.</div>

      <div class="mode-bar">
        <button class="mode-btn" id="btnEditMode" onclick="toggleEditMode()">✏️ 배치/조건 직접 수정</button>
        <button class="action-btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="shuffleCurrentBoard()">🔀 무작위 다시 섞기</button>
      </div>
      
      <div class="grid" id="board"></div>

      <div class="btn-group">
        <button class="action-btn btn-image" onclick="exportAsImage()">📸 빙고 결과 이미지로 저장 (PNG)</button>
      </div>
    </div>
  </div>

  <script>
    let currentSize = 5;
    let itemList = [];
    let selectedIndices = new Set();
    let currentBoard = [];
    let currentFilter = "";
    let currentCriteria = "ownership";

    let isEditMode = false;
    let selectedSwapIndex = null;
    let draggedIndex = null;

    async function fetchDefaultItems() {
      try {
        const response = await fetch("./items.json");
        if (!response.ok) throw new Error("JSON 응답 실패");
        return await response.json();
      } catch (err) {
        console.warn("items.json 로드 실패:", err);
        return [];
      }
    }

    async function initApp() {
      const saved = localStorage.getItem("custom_image_bingo_items");
      if (saved) {
        try {
          itemList = JSON.parse(saved);
        } catch (e) {
          itemList = await fetchDefaultItems();
        }
      } else {
        itemList = await fetchDefaultItems();
      }
      
      updateTextarea();
      renderItemPool();
      autoSelectItems();
      checkSharedUrl();
    }

    async function reloadDefaultJson() {
      if (confirm("items.json 파일의 원본 데이터로 초기화하시겠습니까?")) {
        localStorage.removeItem("custom_image_bingo_items");
        itemList = await fetchDefaultItems();
        updateTextarea();
        selectedIndices.clear();
        document.getElementById("searchInput").value = "";
        currentFilter = "";
        renderItemPool();
        autoSelectItems();
      }
    }

    function updateTextarea() {
      document.getElementById("customInput").value = itemList.map(i => `${i.word} | ${i.img}`).join("\n");
    }

    function saveCustomItems() {
      const text = document.getElementById("customInput").value;
      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      const parsed = [];

      lines.forEach(line => {
        const parts = line.split("|").map(p => p.trim());
        if (parts.length >= 2) {
          parsed.push({ word: parts[0], img: parts[1] });
        } else if (parts.length === 1) {
          parsed.push({ word: parts[0], img: "" });
        }
      });

      if (parsed.length < 16) {
        alert("최소 16개 이상의 캐릭터가 필요합니다.");
        return;
      }

      itemList = parsed;
      localStorage.setItem("custom_image_bingo_items", JSON.stringify(itemList));
      selectedIndices.clear();
      document.getElementById("searchInput").value = "";
      currentFilter = "";
      renderItemPool();
      autoSelectItems();
      alert(`${itemList.length}개의 캐릭터가 적용 및 저장되었습니다.`);
    }

    function handleSearch() {
      currentFilter = document.getElementById("searchInput").value.trim().toLowerCase();
      renderItemPool();
    }

    function renderItemPool() {
      const container = document.getElementById("itemPool");
      container.innerHTML = "";
      
      itemList.forEach((item, idx) => {
        if (currentFilter && !item.word.toLowerCase().includes(currentFilter)) {
          return;
        }

        const chip = document.createElement("div");
        chip.className = `pool-chip ${selectedIndices.has(idx) ? "checked" : ""}`;
        
        const imgTag = item.img ? `<img src="${item.img}" alt="${item.word}" loading="lazy" onerror="this.style.display='none'">` : "";
        chip.innerHTML = `${imgTag}<span>${item.word}</span>`;
        chip.onclick = () => toggleItemSelection(idx, chip);
        container.appendChild(chip);
      });
      updateSelectionUI();
    }

    function toggleItemSelection(idx, chipElement) {
      if (selectedIndices.has(idx)) {
        selectedIndices.delete(idx);
        chipElement.classList.remove("checked");
      } else {
        if (selectedIndices.size >= currentSize * currentSize) {
          alert(`현재 크기(${currentSize}x${currentSize})에서는 최대 ${currentSize * currentSize}개만 선택할 수 있습니다.`);
          return;
        }
        selectedIndices.add(idx);
        chipElement.classList.add("checked");
      }
      updateSelectionUI();
    }

    function autoSelectItems() {
      const target = currentSize * currentSize;
      selectedIndices.clear();
      const indices = Array.from({ length: itemList.length }, (_, i) => i);
      indices.sort(() => 0.5 - Math.random());
      indices.slice(0, target).forEach(i => selectedIndices.add(i));
      renderItemPool();
    }

    function selectAllItems() {
      const target = currentSize * currentSize;
      selectedIndices.clear();
      for (let i = 0; i < Math.min(target, itemList.length); i++) {
        selectedIndices.add(i);
      }
      renderItemPool();
    }

    function clearSelectedItems() {
      selectedIndices.clear();
      renderItemPool();
    }

    function changeSize(size) {
      currentSize = size;
      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.includes(`${size} x ${size}`));
      });

      const maxCount = currentSize * currentSize;
      if (selectedIndices.size > maxCount) {
        selectedIndices = new Set(Array.from(selectedIndices).slice(0, maxCount));
        renderItemPool();
      }
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const target = currentSize * currentSize;
      const countLabel = document.getElementById("selectionCount");
      const generateBtn = document.getElementById("btnGenerate");

      countLabel.innerText = `선택: ${selectedIndices.size} / ${target}`;
      if (selectedIndices.size === target) {
        countLabel.classList.add("ready");
        generateBtn.disabled = false;
      } else {
        countLabel.classList.remove("ready");
        generateBtn.disabled = true;
      }
    }

    function setCriteria(mode) {
      currentCriteria = mode;
      document.getElementById("labelOwnership").classList.toggle("active", mode === "ownership");
      document.getElementById("labelWeapon").classList.toggle("active", mode === "weapon");
      updateScore();
    }

    function generateNewGame() {
      const chosenItems = Array.from(selectedIndices).map(idx => itemList[idx]);
      chosenItems.sort(() => 0.5 - Math.random());
      currentBoard = chosenItems.map(item => ({ ...item, caption: "", state: 0 }));
      
      renderGameBoard();
      document.getElementById("gameArea").style.display = "block";
      document.getElementById("btnShare").style.display = "block";
      updateScore();
    }

    function shuffleCurrentBoard() {
      currentBoard.sort(() => 0.5 - Math.random());
      renderGameBoard();
      updateScore();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      selectedSwapIndex = null;
      const btn = document.getElementById("btnEditMode");
      btn.classList.toggle("active", isEditMode);
      btn.innerText = isEditMode ? "수정 완료 (플레이 모드)" : "✏️ 배치/조건 직접 수정";
      renderGameBoard();
    }

    function swapCells(idx1, idx2) {
      const temp = currentBoard[idx1];
      currentBoard[idx1] = currentBoard[idx2];
      currentBoard[idx2] = temp;
      selectedSwapIndex = null;
      renderGameBoard();
      updateScore();
    }

    function updateCaption(index, value) {
      currentBoard[index].caption = value.trim();
    }

    function renderGameBoard() {
      const boardElement = document.getElementById("board");
      boardElement.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
      boardElement.innerHTML = "";

      currentBoard.forEach((item, index) => {
        const cell = document.createElement("div");
        const statusClass = !isEditMode ? `status-${item.state}` : "";
        cell.className = `cell ${statusClass} ${selectedSwapIndex === index ? "edit-source" : ""}`;
        
        if (isEditMode) {
          cell.draggable = true;
          cell.ondragstart = (e) => {
            draggedIndex = index;
            e.dataTransfer.effectAllowed = "move";
          };
          cell.ondragover = (e) => {
            e.preventDefault();
            cell.classList.add("drag-over");
          };
          cell.ondragleave = () => {
            cell.classList.remove("drag-over");
          };
          cell.ondrop = (e) => {
            e.preventDefault();
            cell.classList.remove("drag-over");
            if (draggedIndex !== null && draggedIndex !== index) {
              swapCells(draggedIndex, index);
            }
          };
        }

        const imgTag = item.img ? `<img src="${item.img}" alt="${item.word}" loading="lazy" crossorigin="anonymous">` : `<div style="height:60%;"></div>`;
        
        // 상태 뱃지 (좌측 상단)
        let stateBadgeHTML = "";
        if (!isEditMode) {
          if (item.state === 1) stateBadgeHTML = `<div class="state-badge status-1">보유</div>`;
          if (item.state === 2) stateBadgeHTML = `<div class="state-badge status-2">전무★</div>`;
        }

        // 조건 캡션 (우측 상단)
        let captionHTML = "";
        if (isEditMode) {
          captionHTML = `<input type="text" class="cell-caption-input" placeholder="조건(예: 전3)" value="${item.caption || ""}" onclick="event.stopPropagation()" oninput="updateCaption(${index}, this.value)">`;
        } else if (item.caption) {
          captionHTML = `<div class="caption-badge">${item.caption}</div>`;
        }

        cell.innerHTML = `
          ${stateBadgeHTML}
          ${captionHTML}
          ${imgTag}
          <div class="word-label">${item.word}</div>
        `;

        cell.onclick = (e) => {
          if (isEditMode) {
            if (e.target.tagName === 'INPUT') return;
            if (selectedSwapIndex === null) {
              selectedSwapIndex = index;
              renderGameBoard();
            } else if (selectedSwapIndex === index) {
              selectedSwapIndex = null;
              renderGameBoard();
            } else {
              swapCells(selectedSwapIndex, index);
            }
          } else {
            currentBoard[index].state = (currentBoard[index].state + 1) % 3;
            renderGameBoard();
            updateScore();
          }
        };

        boardElement.appendChild(cell);
      });
    }

    function resetCheck() {
      currentBoard.forEach(c => c.state = 0);
      renderGameBoard();
      updateScore();
    }

    function isCellValid(item) {
      if (currentCriteria === "ownership") {
        return item.state >= 1;
      } else {
        return item.state === 2;
      }
    }

    function updateScore() {
      const lines = calculateBingoLines();
      const criteriaName = currentCriteria === "ownership" ? "보유 기준" : "전용무기 기준";
      document.getElementById("bingoScore").innerText = `완성된 빙고 (${criteriaName}): ${lines}줄`;
    }

    function calculateBingoLines() {
      let lines = 0;
      const n = currentSize;

      for (let r = 0; r < n; r++) {
        if (currentBoard.slice(r * n, (r + 1) * n).every(isCellValid)) lines++;
      }
      for (let c = 0; c < n; c++) {
        let full = true;
        for (let r = 0; r < n; r++) {
          if (!isCellValid(currentBoard[r * n + c])) { full = false; break; }
        }
        if (full) lines++;
      }
      let d1 = true;
      for (let i = 0; i < n; i++) {
        if (!isCellValid(currentBoard[i * n + i])) { d1 = false; break; }
      }
      if (d1) lines++;

      let d2 = true;
      for (let i = 0; i < n; i++) {
        if (!isCellValid(currentBoard[i * n + (n - 1 - i)])) { d2 = false; break; }
      }
      if (d2) lines++;

      return lines;
    }

    function copyShareUrl() {
      const chosenItems = currentBoard.map(b => ({ word: b.word, img: b.img, caption: b.caption || "" }));
      const payload = {
        t: document.getElementById("boardTitle").value.trim(),
        s: currentSize,
        items: chosenItems
      };
      
      const hashData = btoa(encodeURIComponent(JSON.stringify(payload)));
      const shareUrl = `${window.location.origin}${window.location.pathname}#${hashData}`;

      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("빙고판 링크가 복사되었습니다!");
      }).catch(() => {
        prompt("아래 링크를 복사하세요:", shareUrl);
      });
    }

    function checkSharedUrl() {
      if (window.location.hash) {
        try {
          const hashData = window.location.hash.substring(1);
          const payload = JSON.parse(decodeURIComponent(atob(hashData)));

          if (payload.t) {
            document.getElementById("boardTitle").value = payload.t;
          }
          currentSize = payload.s;
          changeSize(currentSize);
          currentBoard = payload.items.map(item => ({ ...item, state: 0 }));
          renderGameBoard();
          document.getElementById("gameArea").style.display = "block";
          document.getElementById("btnShare").style.display = "block";
          updateScore();
        } catch (e) {
          console.error("공유 데이터 로드 실패", e);
        }
      }
    }

    async function exportAsImage() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const dpr = 2;

      const title = document.getElementById("boardTitle").value.trim() || "인권 빙고";
      const width = 640;
      const padding = 24;
      const headerHeight = 100;
      const boardWidth = width - padding * 2;
      const gap = 8;
      const cellSize = (boardWidth - (currentSize - 1) * gap) / currentSize;
      const boardHeight = cellSize * currentSize + (currentSize - 1) * gap;
      const totalHeight = headerHeight + boardHeight + padding + 20;

      canvas.width = width * dpr;
      canvas.height = totalHeight * dpr;
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, width, totalHeight);

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(title, width / 2, 40);

      const criteriaName = currentCriteria === "ownership" ? "단순 보유 기준" : "전용무기 기준";
      ctx.fillStyle = "#2563eb";
      ctx.font = "bold 15px -apple-system, sans-serif";
      ctx.fillText(`완성된 빙고 (${criteriaName}): ${calculateBingoLines()}줄`, width / 2, 68);

      const imagePromises = currentBoard.map(item => {
        return new Promise((resolve) => {
          if (!item.img) return resolve(null);
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = item.img;
        });
      });

      const loadedImages = await Promise.all(imagePromises);

      currentBoard.forEach((item, index) => {
        const row = Math.floor(index / currentSize);
        const col = index % currentSize;
        const x = padding + col * (cellSize + gap);
        const y = headerHeight + row * (cellSize + gap);

        ctx.save();
        
        // 카드 배경 색상 (선택 시 부드러운 틴트)
        let bgColor = "#ffffff";
        let strokeColor = "#cbd5e1";
        let lineWidth = 2;

        if (item.state === 1) {
          bgColor = "#fefce8";
          strokeColor = "#eab308";
          lineWidth = 3.5;
        } else if (item.state === 2) {
          bgColor = "#ecfeff";
          strokeColor = "#0891b2";
          lineWidth = 3.5;
        }

        ctx.fillStyle = bgColor;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.roundRect(x, y, cellSize, cellSize, 8);
        ctx.fill();
        ctx.stroke();
        ctx.clip();

        // 썸네일 이미지 (선명하게 유지)
        const loadedImg = loadedImages[index];
        const imgH = cellSize * 0.60;
        if (loadedImg) {
          ctx.drawImage(loadedImg, x + 4, y + 4, cellSize - 8, imgH);
        }

        // 좌측 상단 상태 뱃지 (보유 / 전무★)
        if (item.state === 1) {
          ctx.fillStyle = "#eab308";
          ctx.beginPath();
          ctx.roundRect(x + 4, y + 4, 30, 15, 3);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 9px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("보유", x + 19, y + 12);
        } else if (item.state === 2) {
          ctx.fillStyle = "#0891b2";
          ctx.beginPath();
          ctx.roundRect(x + 4, y + 4, 38, 15, 3);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 9px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("전무★", x + 23, y + 12);
        }

        // 우측 상단 조건 캡션 (전3 등)
        if (item.caption) {
          ctx.font = "bold 10px -apple-system, sans-serif";
          const textMetrics = ctx.measureText(item.caption);
          const bgW = textMetrics.width + 10;
          const bgH = 16;
          const bx = x + cellSize - bgW - 4;
          const by = y + 4;

          ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
          ctx.beginPath();
          ctx.roundRect(bx, by, bgW, bgH, 4);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(item.caption, bx + bgW / 2, by + bgH / 2);
        }

        // 하단 캐릭터 이름
        ctx.fillStyle = "#1e293b";
        ctx.font = `bold ${cellSize < 70 ? "11px" : "13px"} -apple-system, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.word, x + cellSize / 2, y + imgH + (cellSize - imgH) / 2 + 2);

        ctx.restore();
      });

      const link = document.createElement("a");
      link.download = `${title.replace(/\s+/g, '_')}_${Date.now()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    initApp();
  </script>
</body>
